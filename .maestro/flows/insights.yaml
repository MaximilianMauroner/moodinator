appId: com.lab4code.moodinator.qa
name: Insights charts and calendar with one recorded entry
---
- assertVisible: "Charts view"
- assertVisible: "Trend"
- scrollUntilVisible:
    element:
      text: "A comparison needs 5 entries with a tag or emotion and 5 without it."
    direction: DOWN
- assertVisible: "A comparison needs 5 entries with a tag or emotion and 5 without it."
- tapOn: "Calendar view"
- tapOn: "Charts view"
- assertVisible: "Trend"
