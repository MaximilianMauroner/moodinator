appId: com.lab4code.moodinator.qa
name: Import a fabricated native stress fixture
---
- launchApp:
    clearState: true
- runFlow: onboarding.yaml
- tapOn:
    id: "open-settings"
- scrollUntilVisible:
    element:
      text: "Data & Backups"
    direction: DOWN
- tapOn: "Data & Backups settings"
- tapOn: "Import Data"
