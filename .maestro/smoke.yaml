appId: com.lab4code.moodinator.qa
name: Isolated Android entry lifecycle
---
# Destructive only to the separately installed QA app. Use bun run qa:smoke.
- launchApp:
    clearState: true
- runFlow: flows/onboarding.yaml
- longPressOn: "Mood Rating 5 of 10, Neutral. Lower numbers are better."
- assertVisible: "(?i)What emotions are present[?]"
- scrollUntilVisible:
    element:
      id: "emotion-option-Happy"
    direction: DOWN
- tapOn:
    id: "emotion-option-Happy"
- tapOn: "Next step"
- assertVisible: "(?i)Any more context[?]"
- scrollUntilVisible:
    element:
      id: "energy-level-6"
    direction: DOWN
- tapOn:
    id: "energy-level-6"
- scrollUntilVisible:
    element:
      text: "Average · 6/10"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "entry-notes"
    direction: DOWN
- tapOn:
    id: "entry-notes"
- inputText: "QA smoke original note"
- hideKeyboard
- tapOn: "Save entry"
- assertVisible:
    id: "mood-entry-actions-.*"
- stopApp
- launchApp:
    clearState: false
# Reopen the stored record. These checks verify fields after process restart.
- tapOn:
    id: "mood-entry-actions-.*"
- tapOn: "Edit entry"
- assertVisible: "(?i)How are you feeling[?]"
- tapOn: "Next step"
- assertVisible:
    id: "emotion-remove-Happy"
- tapOn: "Next step"
- scrollUntilVisible:
    element:
      text: "Average · 6/10"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "entry-notes"
    direction: DOWN
- assertVisible:
    id: "entry-notes"
    text: "QA smoke original note"
- tapOn:
    id: "entry-notes"
- eraseText
- inputText: "QA smoke edited note"
- hideKeyboard
- tapOn: "Save entry"
- tapOn:
    id: "mood-entry-actions-.*"
- tapOn: "Edit entry"
- tapOn: "Next step"
- tapOn: "Next step"
- scrollUntilVisible:
    element:
      id: "entry-notes"
    direction: DOWN
- assertVisible:
    id: "entry-notes"
    text: "QA smoke edited note"
- tapOn: "Save entry"
- tapOn:
    id: "mood-entry-actions-.*"
- tapOn: "Delete entry"
- tapOn: "Undo delete"
- assertVisible:
    id: "mood-entry-actions-.*"
- tapOn: "Insights tab, view mood history and summaries"
- assertVisible: "Your history · 1 entry"
- tapOn: "Refresh insights"
- assertVisible: "Your history · 1 entry"
- runFlow: flows/insights.yaml
