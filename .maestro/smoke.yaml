appId: com.lab4code.moodinator.qa
name: Isolated Android entry lifecycle
---
# Run only with the isolated QA app.
- launchApp:
    clearState: true
- runFlow: flows/onboarding.yaml
- tapOn:
    id: "open-settings"
- tapOn: "Quick Entry"
- tapOn: "Notes"
- back
- back
- assertVisible: "Choose a mood"
- assertVisible: "Mood Rating 0 of 10, Elated. Lower numbers are better."
- assertVisible: "Mood Rating 10 of 10, Emergency. Lower numbers are better."
- tapOn: "Mood Rating 5 of 10, Neutral. Lower numbers are better."
- tapOn: "Clear"
- assertVisible: "No check-in yet today"
- tapOn: "Mood Rating 5 of 10, Neutral. Lower numbers are better."
- tapOn: "All feelings"
- scrollUntilVisible:
    element:
      id: "emotion-option-Happy"
    direction: DOWN
- tapOn:
    id: "emotion-option-Happy"
- tapOn: "Done with details"
- assertVisible: "No check-in yet today"
- tapOn: "Next · Context"
- tapOn: "Energy & note (optional)"
- tapOn: "Energy 5"
- tapOn: "Note"
- inputText: "QA smoke original note"
- hideKeyboard
- tapOn: "Done with details"
- tapOn:
    id: "check-in-keep"
- tapOn: "History tab, view past days and months"
- assertVisible:
    id: "mood-entry-actions-.*"
- stopApp
- launchApp:
    clearState: false
# Reopen the stored record. These checks verify fields after process restart.
- tapOn: "History tab, view past days and months"
- tapOn:
    id: "mood-entry-actions-.*"
- tapOn: "Edit entry"
- assertVisible: "(?i)How are you feeling[?]"
- tapOn: "Next step"
- assertVisible:
    id: "emotion-remove-Happy"
- tapOn: "Next step"
- scrollUntilVisible:
    element:
      text: "Average · 5/10"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "entry-notes"
    direction: DOWN
- assertVisible:
    id: "entry-notes"
    text: "QA smoke original note"
- tapOn:
    id: "entry-notes"
- eraseText
- inputText: "QA smoke edited note"
- hideKeyboard
- tapOn: "Save entry"
- tapOn:
    id: "mood-entry-actions-.*"
- tapOn: "Edit entry"
- tapOn: "Next step"
- tapOn: "Next step"
- scrollUntilVisible:
    element:
      id: "entry-notes"
    direction: DOWN
- assertVisible:
    id: "entry-notes"
    text: "QA smoke edited note"
- tapOn: "Save entry"
# Check Insights before deletion; the runner owns the synchronized native
# delete/absence/Undo/restoration phase below.
- tapOn: "Insights tab, view mood patterns and summaries"
- assertVisible: "Your history · 1 entry"
- tapOn: "Refresh insights"
- assertVisible: "Your history · 1 entry"
- runFlow: flows/insights.yaml
- tapOn: "History tab, view past days and months"
- tapOn: "Month view"
- assertVisible: "Calendar legend: a dot marks a day with multiple entries."
- tapOn: "Days view"
