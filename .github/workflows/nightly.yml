name: Android nightly

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Europe/Vienna
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:nightly

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'MaximilianMauroner/moodinator'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: moodinator-android-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set ephemeral paths
        run: |
          echo "RELEASE_ARTIFACTS_DIR=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          echo "ANDROID_BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Check secrets and prepare private Play key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/prepare-hosted-release.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android tools and runner resources
        shell: bash
        run: |
          set -euo pipefail
          # Remove only unused tool bundles on this disposable hosted runner.
          if [ "$(df --output=avail -B1 . | tail -1)" -lt 21474836480 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          fi
          df -h .
          free -h
          test "$(df --output=avail -B1 . | tail -1)" -ge 16106127360
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 8388608
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar --output "$ANDROID_BUNDLETOOL_JAR"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $ANDROID_BUNDLETOOL_JAR" | sha256sum --check
          npm install --global eas-cli@20.5.1
      - name: Check fetched main, reserve, build, verify and upload Internal
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/nightly-release.mjs run
      - name: Remove private key and raw EAS logs
        if: always()
        run: |
          rm -f "$PLAY_SERVICE_ACCOUNT_KEY_PATH"
          rm -rf "$HOME/.local/state/lab4code-releases/logs/moodinator"
      - name: Retain verified bundles and sanitized release records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodinator-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-artifacts/**/verified/*.apk
            ${{ runner.temp }}/release-artifacts/**/verified/*.aab
            ${{ runner.temp }}/release-artifacts/**/release.json
          if-no-files-found: ignore
          retention-days: 30
