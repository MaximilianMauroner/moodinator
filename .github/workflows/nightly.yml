name: Android nightly

on:
  schedule:
    - cron: '0 0 * * 1,3,5'
      timezone: Europe/Vienna
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: moodinator-${{ github.event_name == 'pull_request' && github.ref || 'android-nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - name: Capture exact source before checks
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.34.6'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run test:nightly

  build:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'MaximilianMauroner/moodinator'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Required for ledger reservation.
    outputs:
      build: ${{ steps.reserve.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          persist-credentials: false
      - name: Set ephemeral artifact path
        run: echo "RELEASE_ARTIFACTS_DIR=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10.34.6'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate public Android SDK tools
        id: sdk
        run: echo "path=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Restore public build tools
        id: tools
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platform-tools
            ${{ steps.sdk.outputs.path }}/platforms/android-36
            ${{ steps.sdk.outputs.path }}/build-tools/36.0.0
            ~/.npm/_cacache
            ~/.gradle/wrapper/dists
          key: moodinator-android-public-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/setup-hosted-android.sh', '.github/workflows/nightly.yml') }}
      - name: Install locked dependencies without lifecycle scripts or release credentials
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare tools without release credentials
        run: bash scripts/setup-hosted-android.sh build
      - name: Download the locked Gradle distribution without release credentials
        run: |
          gradle_wrapper=$(node -p "require.resolve('@react-native/gradle-plugin/gradlew', { paths: [require.resolve('react-native/package.json')] })")
          "$gradle_wrapper" --version --no-daemon
      # Snapshot before any credential-bearing step. No post-build cache save.
      - name: Save public build tools before release credentials
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platform-tools
            ${{ steps.sdk.outputs.path }}/platforms/android-36
            ${{ steps.sdk.outputs.path }}/build-tools/36.0.0
            ~/.npm/_cacache
            ~/.gradle/wrapper/dists
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Validate both user secrets without creating a Play file
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/prepare-hosted-release.mjs validate
      - name: Require current main to equal checked SHA and persist reservation
        id: reserve
        env:
          RELEASE_CHECKED_SHA: ${{ needs.checks.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hosted-release.mjs reserve
      - name: Transfer public reservation receipt before building
        id: receipt
        if: steps.reserve.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodinator-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts/reservation.json
          if-no-files-found: error
          retention-days: 30
      - name: Build and verify with Expo credentials only
        if: success() && steps.reserve.outputs.build == 'true' && steps.receipt.outcome == 'success'
        env:
          RELEASE_CHECKED_SHA: ${{ needs.checks.outputs.source_sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/nightly-release.mjs build
      - name: Remove raw EAS logs
        if: always()
        run: rm -rf "$HOME/.local/state/lab4code-releases/logs/moodinator"
      - name: Retain verified bundles and sanitized build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodinator-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-artifacts/verified/*.apk
            ${{ runner.temp }}/release-artifacts/verified/*.aab
            ${{ runner.temp }}/release-artifacts/release.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [checks, build]
    if: always() && !cancelled() && needs.checks.result == 'success' && needs.build.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Required for ledger finalization.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          persist-credentials: false
      - name: Set ephemeral paths
        run: |
          echo "RELEASE_ARTIFACTS_DIR=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
          echo "PLAY_SERVICE_ACCOUNT_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - name: Download public reservation receipt even after ordinary build failure
        if: always() && !cancelled()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moodinator-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: needs.build.result == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare artifact verification tools without credentials
        if: needs.build.result == 'success'
        run: bash scripts/setup-hosted-android.sh verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.build.result == 'success'
        with:
          name: moodinator-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Reverify, upload Internal and finish the ledger
        if: always() && !cancelled()
        env:
          RELEASE_CHECKED_SHA: ${{ needs.checks.outputs.source_sha }}
          RELEASE_BUILD_RESULT: ${{ needs.build.result }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hosted-release.mjs publish
      - name: Remove private key
        if: always()
        run: rm -f "$PLAY_SERVICE_ACCOUNT_KEY_PATH"
      - name: Retain sanitized final release record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodinator-internal-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifacts/release.json
          if-no-files-found: ignore
          retention-days: 30
