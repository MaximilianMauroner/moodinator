name: Android build-core benchmark

on:
  push:
    branches: [perf/nightly-build-cores]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare public Android tools
        run: bash scripts/setup-hosted-android.sh verify
      - name: Build matched bundles
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          EXPO_PUBLIC_REPORTS_ORIGIN: https://tools.mauroner.net
        run: |
          set -euo pipefail
          nproc
          free -h
          results="$RUNNER_TEMP/core-results"
          source_dir="$RUNNER_TEMP/core-source"
          seed="$RUNNER_TEMP/core-gradle-seed"
          trial_cache="$RUNNER_TEMP/core-gradle-trial"
          mkdir -p "$results"
          build_one() {
            local label="$1" jobs="$2" gradle_home="$3"
            mkdir -p "$source_dir"
            git archive "$GITHUB_SHA" | tar -x -C "$source_dir"
            cd "$source_dir"
            pnpm install --frozen-lockfile --ignore-scripts > "$results/$label-install.log" 2>&1
            pnpm exec expo prebuild --platform android --no-install > "$results/$label-prebuild.log" 2>&1
            cd android
            export GRADLE_USER_HOME="$gradle_home"
            export CMAKE_BUILD_PARALLEL_LEVEL="$jobs"
            export GRADLE_OPTS="-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options=-Xmx768m"
            export ORG_GRADLE_PROJECT_reactNativeArchitectures=armeabi-v7a,arm64-v8a
            /usr/bin/time -f 'elapsed_seconds=%e exit=%x user_seconds=%U system_seconds=%S peak_kib=%M' -o "$results/$label-time.txt" ./gradlew :app:bundleRelease --no-daemon --no-build-cache > "$results/$label-build.log" 2>&1
            cp app/build/outputs/bundle/release/app-release.aab "$results/$label.aab"
            java -jar "$ANDROID_BUNDLETOOL_JAR" validate --bundle="$results/$label.aab" > "$results/$label-validation.log" 2>&1
            cat "$results/$label-time.txt"
            cd "$GITHUB_WORKSPACE"
            rm -rf "$source_dir"
          }
          build_one seed 2 "$seed"
          for trial in 1-two 2-four 3-two 4-four; do
            cp -a "$seed" "$trial_cache"
            case "$trial" in *-two) jobs=2;; *) jobs=4;; esac
            build_one "$trial" "$jobs" "$trial_cache"
            rm -rf "$trial_cache"
          done
          python3 - "$results" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          expected = {'armeabi-v7a', 'arm64-v8a'}
          for label in ('seed', '1-two', '2-four', '3-two', '4-four'):
              with zipfile.ZipFile(root / f'{label}.aab') as bundle:
                  paths = [n for n in bundle.namelist() if n.startswith('base/lib/') and n.endswith('.so')]
                  actual = {n.split('/')[2] for n in paths}
                  if actual != expected:
                      raise SystemExit(f'{label}: ABI mismatch {actual}')
                  print(f'{label}: {len(paths)} libraries, ABIs {sorted(actual)}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-core-results
          path: ${{ runner.temp }}/core-results
          if-no-files-found: error
          retention-days: 3
