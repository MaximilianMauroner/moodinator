name: One-shot prefill145 remaining acceptance
on:
  push:
    branches: [qa/prefill145-readiness-20261015-r14]
permissions:
  contents: read
concurrency:
  group: prefill145-readiness-r14-once
  cancel-in-progress: false
jobs:
  pending:
    if: github.repository == 'MaximilianMauroner/moodinator' && github.event.repository.private == false && github.event.created == true && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Attach pending verification to exact product head
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/MaximilianMauroner/moodinator/statuses/e2c7bf7caa87943cfdb253373883616168686d98'
          data = json.dumps({'state':'pending','context':'prefill145/native-acceptance','description':'Same-source remaining note-only Save proof; twelve completed cases retained','target_url':os.environ['RUN_URL']}).encode()
          request = urllib.request.Request(url, data=data, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_STATUS_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if result.get('state') != 'pending' or result.get('context') != 'prefill145/native-acceptance':
              raise RuntimeError('Pending product status was not confirmed')
          print('Pending verification linked to exact #145 source')
          PY
  readiness:
    needs: pending
    if: github.repository == 'MaximilianMauroner/moodinator' && github.event.repository.private == false && github.event.created == true && github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: operator
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e2c7bf7caa87943cfdb253373883616168686d98
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.1'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Guarded pure note-navigation controls
        env:
          MOODINATOR_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          python3 - <<'PYGUARD'
          import json, os, shutil, sys
          from pathlib import Path
          control = Path('operator/.github/qa-prefill145').resolve()
          root = Path(os.environ['RUNNER_TEMP']) / 'moodinator145-pure'
          root.mkdir(exist_ok=False)
          (root / 'native').mkdir()
          (root / 'tools').mkdir()
          shutil.copyfile(control / 'run-native.py', root / 'native/run-native.py')
          shutil.copyfile(control / 'heavy-check', root / 'tools/heavy-check')
          (root / 'tools/heavy-check').chmod(0o755)
          config = {'cwd': os.environ['MOODINATOR_SOURCE_ROOT'], 'timeout': '20s',
                    'command': [sys.executable, '-B', str(control / 'note_navigation_controls.py')],
                    'env': {'NODE_OPTIONS': '--max-old-space-size=1536'},
                    'source': 'e2c7bf7caa87943cfdb253373883616168686d98',
                    'scope': 'Pure focused navigation/SQLite replay; no native/product acceptance claim'}
          path = root / 'native/note-controls-command.json'
          path.write_text(json.dumps(config, indent=2) + '\n')
          os.execv(sys.executable, [sys.executable, str(root / 'native/run-native.py'), 'note-controls', str(path)])
          PYGUARD
      - name: Preserve guarded pure control evidence
        if: always()
        run: |
          python3 - <<'PYEVIDENCE'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'moodinator145-pure/native'
          names = ['note-controls-command.json', 'note-controls.json', 'note-controls.preflight.jsonl',
                   'note-controls.metrics.jsonl', 'note-controls.log']
          total = 0
          for name in names:
              path = root / name
              if not path.is_file():
                  continue
              size = path.stat().st_size
              if path.is_symlink() or size > 1024 * 1024 or total + size > 4 * 1024 * 1024:
                  raise RuntimeError('Pure control evidence bound/path refused')
              with path.open('rb') as stream:
                  data = stream.read(1024 * 1024 + 1)
              if len(data) != size:
                  raise RuntimeError('Pure control evidence changed while reading')
              total += len(data)
              print('PREFILL145_PURE_EVIDENCE ' + json.dumps({'name': name, 'bytes': len(data),
                    'sha256': hashlib.sha256(data).hexdigest(), 'base64': base64.b64encode(data).decode()}), flush=True)
          receipt = json.loads((root / 'note-controls.json').read_text())
          if receipt.get('status') != 'PASS' or receipt.get('exit_code') != 0 or receipt.get('residual_after_cleanup') != []:
              raise RuntimeError('Pure controls failed or did not execute; native work must not start')
          PYEVIDENCE
      - name: Exact source native build and remaining note-only acceptance
        env:
          MOODINATOR_SOURCE_ROOT: ${{ github.workspace }}/source
        run: python3 operator/.github/qa-prefill145/driver.py
      - name: Restore owned KVM access before evidence publication
        if: always()
        timeout-minutes: 1
        run: timeout 40s nice -n 10 python3 operator/.github/qa-prefill145/kvm-access.py restore
      - name: Retain bounded task evidence in logs
        if: always()
        env:
          MOODINATOR_SOURCE_ROOT: ${{ github.workspace }}/source
          XDG_RUNTIME_DIR: ${{ runner.temp }}/moodinator145-qa/runtime
        run: bash operator/.github/qa-prefill145/heavy-check --repo "$MOODINATOR_SOURCE_ROOT" --lock-timeout 0 --timeout 90s -- nice -n 10 python3 operator/.github/qa-prefill145/log-evidence.py
  result:
    needs: [pending, readiness]
    if: always() && needs.pending.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record actual native and product verdict on exact head
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          READINESS_RESULT: ${{ needs.readiness.result }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          state = 'success' if os.environ['READINESS_RESULT'] == 'success' else 'failure'
          description = 'Native build, actual manifest and remaining note-only Save passed; twelve cases retained' if state == 'success' else 'Native/product verification failed or was blocked; see run evidence'
          url = 'https://api.github.com/repos/MaximilianMauroner/moodinator/statuses/e2c7bf7caa87943cfdb253373883616168686d98'
          data = json.dumps({'state':state,'context':'prefill145/native-acceptance','description':description,'target_url':os.environ['RUN_URL']}).encode()
          request = urllib.request.Request(url, data=data, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_STATUS_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if result.get('state') != state or result.get('context') != 'prefill145/native-acceptance':
              raise RuntimeError('Terminal product status was not confirmed')
          print('Exact-source native/product status: '+state)
          PY
