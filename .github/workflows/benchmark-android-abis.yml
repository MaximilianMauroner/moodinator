name: Android ABI experiment
on:
  push:
    branches: [android-arm-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all
            abis: armeabi-v7a,arm64-v8a,x86,x86_64
          - name: arm
            abis: armeabi-v7a,arm64-v8a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.13.1'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec expo prebuild --platform android --no-install
      - name: Build bundle
        working-directory: android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options=-Xmx768m
          NODE_OPTIONS: --max-old-space-size=1536
          EXPO_PUBLIC_REPORTS_ORIGIN: https://tools.mauroner.net
          ORG_GRADLE_PROJECT_reactNativeArchitectures: ${{ matrix.abis }}
        run: |
          /usr/bin/time -f 'elapsed_seconds=%e exit=%x' ./gradlew :app:bundleRelease --no-daemon --no-build-cache
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Verify bundle
        env:
          EXPECTED_ABIS: ${{ matrix.abis }}
        run: |
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=android/app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              paths = set(bundle.namelist())
          actual = {p.split('/')[2] for p in paths if p.startswith('base/lib/') and p.endswith('.so')}
          expected = set(os.environ['EXPECTED_ABIS'].split(','))
          print('ABIs:', sorted(actual))
          if actual != expected:
              raise SystemExit('Unexpected bundle ABIs')
          for abi in expected:
              for name in ('libreactnative.so', 'libhermesvm.so', 'libexpo-sqlite.so', 'libcrypto.so'):
                  if f'base/lib/{abi}/{name}' not in paths:
                      raise SystemExit(f'Missing {abi}/{name}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-abi-${{ matrix.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
